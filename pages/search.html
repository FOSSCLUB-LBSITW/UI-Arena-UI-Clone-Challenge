<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Search - Foodie</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">

    <a
        href="../index.html"
        class="logo"
    >
        <span>food</span>ie
    </a>


    <div class="location">

        <span class="location-icon">
            📍
        </span>

        <div>

            <small>
                Delivering to
            </small>

            <strong>
                Kerala, India ▾
            </strong>

        </div>

    </div>


    <nav class="nav-links">

        <a href="../index.html">
            🏠 Home
        </a>

        <a href="search.html">
            🔍 Search
        </a>

        <a href="help.html">
            ❓ Help
        </a>

        <a
            href="cart.html"
            class="cart-link"
        >

            🛒 Cart

            <span
                id="cartCount"
                class="cart-count"
            >
                0
            </span>

        </a>

    </nav>

</header>



<!-- =========================
     SEARCH PAGE
========================= -->

<main class="search-page">


    <div class="search-heading">

        <p class="section-label">
            DISCOVER FOOD
        </p>

        <h1>
            Search for your favourite food
        </h1>

        <p>
            Find restaurants, cuisines and dishes near you.
        </p>

    </div>



    <!-- SEARCH BOX -->

    <div class="search-page-box">

        <span>
            🔍
        </span>

        <input
            type="text"
            id="searchInput"
            placeholder="Search restaurants or dishes..."
        >

        <button
            onclick="performSearch()"
        >
            Search
        </button>

    </div>



    <!-- =========================
         POPULAR SEARCHES
    ========================= -->

    <div class="popular-searches">

        <span>
            Popular:
        </span>


        <button onclick="setSearch('Pizza')">
            🍕 Pizza
        </button>


        <button onclick="setSearch('Biryani')">
            🍛 Biryani
        </button>


        <button onclick="setSearch('Mandi')">
            🍗 Mandi
        </button>


        <button onclick="setSearch('Porotta')">
            🫓 Porotta
        </button>


        <button onclick="setSearch('Fried Rice')">
            🍚 Fried Rice
        </button>


        <button onclick="setSearch('Shawarma')">
            🌯 Shawarma
        </button>


        <button onclick="setSearch('Paneer')">
            🧀 Paneer
        </button>


        <button onclick="setSearch('Gobi')">
            🥦 Gobi Manchurian
        </button>


        <button onclick="setSearch('Chicken Fry')">
            🍗 Chicken Fry
        </button>


        <button onclick="setSearch('Chicken 65')">
            🍗 Chicken 65
        </button>


        <button onclick="setSearch('Burger')">
            🍔 Burger
        </button>

    </div>



    <!-- =========================
         RESULTS
    ========================= -->

    <section class="search-results">


        <div class="search-results-heading">

            <h2 id="resultsTitle">
                Popular restaurants & dishes
            </h2>

            <span id="resultCount"></span>

        </div>


        <div
            id="searchResults"
            class="search-result-grid"
        >
        </div>


    </section>


</main>



<!-- =========================
     FOOTER
========================= -->

<footer>

    <div class="footer-logo">

        <span>
            food
        </span>ie

    </div>


    <p>
        © 2026 Foodie.
        Built for UI Arena Challenge.
    </p>


    <div>

        <a href="help.html">
            Help
        </a>

        <a href="#">
            Privacy
        </a>

        <a href="#">
            Terms
        </a>

    </div>

</footer>



<script src="../js/app.js"></script>

</body>
<!-- ================= PAGE NAVIGATION ================= -->

<div class="page-navigation">

    <button
        onclick="goBack()"
        class="back-button"
    >
        ← Back
    </button>

    <a
        href="../index.html"
        class="home-button"
    >
        🏠 Home
    </a>

</div>
</html>
