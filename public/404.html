<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Swiggy — Food delivery and takeaway</title>
    <script>
      // Single Page Apps for GitHub Pages: redirect a 404 deep link
      // (e.g. /restaurant/paragon) to index.html with the path encoded
      // in the query string, so React Router can restore it on load.
      var segmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?p=' +
        l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
